# Mosquitto MQTT broker config (v1 demo — allow anonymous)
# v2: enable TLS + per-device ACLs per Security.md §11

listener 1883
allow_anonymous true

# WebSocket support
listener 9001
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all
